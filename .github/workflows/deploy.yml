
name: Deploy portfolio to OVHcloud

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Secret scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  build:
    name: Tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: node --experimental-strip-types --test scripts/*.test.mjs

      - name: Build Astro website
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest

    needs: [security, build]

    if: github.ref == 'refs/heads/main'

    environment: production

    concurrency:
      group: portfolio-production
      cancel-in-progress: false

    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v6

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: portfolio-dist
          path: dist/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SFTP dependency
        run: python -m pip install "paramiko>=3.5,<5"

      - name: Upload website via SFTP
        env:
          SFTP_HOST: ${{ vars.SFTP_HOST }}
          SFTP_USER: ${{ vars.SFTP_USER }}
          SFTP_TARGET: ${{ vars.SFTP_TARGET }}
          SFTP_HOST_FINGERPRINT: ${{ vars.SFTP_HOST_FINGERPRINT }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: python scripts/deploy_sftp.py
