    <g fill="#22273a" stroke="#7773a9" stroke-width="2">
      <rect x="52" y="160" width="250" height="105" rx="9"/>
      <rect x="355" y="160" width="250" height="105" rx="9"/>
      <rect x="658" y="160" width="250" height="105" rx="9"/>
